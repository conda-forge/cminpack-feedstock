context:
  version: "1.3.16"

package:
  name: cminpack
  version: ${{ version }}

source:
  url: https://github.com/devernay/cminpack/archive/v${{ version }}.tar.gz
  sha256: 90f717a8e7fb212430d7fe5265ecc7ea24f669e4613e2a920fb9b1d3be9209d1

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - if: win
      then: m2-dos2unix
  host:
    - libblas
  run_exports:
    - ${{ pin_subpackage('cminpack', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - cminpack-1/cminpack.h
        - cminpack-1/minpack.h
      lib:
        - cminpack

about:
  homepage: http://devernay.free.fr/hacks/cminpack/index.html
  license: LicenseRef-MINPACK  # Custom BSD-like
  license_family: BSD
  summary: CMinpack includes software for solving nonlinear equations and nonlinear least squares problems
  license_file: CopyrightMINPACK.txt
  repository: https://github.com/devernay/cminpack

extra:
  recipe-maintainers:
    - tadeu
    - jschueller
